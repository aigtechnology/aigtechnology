<main id="main"><section class="page-hero"><div class="container"><p class="eyebrow">Customer account</p><h1>Sign in with your mobile</h1><p>Login is optional and does not block guest checkout.</p></div></section><section class="section"><div class="container content-narrow"><form id="customer-login-form" class="form-panel" novalidate><h2>Customer login</h2><p class="notice">We will send a one-time verification code by SMS.</p><div class="field"><label for="customer-phone">Mobile number</label><input id="customer-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 9876543210" required></div><div id="recaptcha-container" class="field"></div><button id="send-code" class="button" type="submit">Send verification code</button><div id="otp-section" hidden><div class="field"><label for="customer-otp">Verification code</label><input id="customer-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456"></div><button id="verify-code" class="button" type="button">Verify and continue</button></div><p id="customer-login-status" class="form-status" role="status" aria-live="polite"></p></form></div></section></main>
